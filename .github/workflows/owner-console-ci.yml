name: Platform Owner Console CI
# Tests run once per commit (on push). The pull request trigger was removed because it ran every commit twice.
on:
  push:
    branches:
      - feature/platform-owner-console-v1
      - feature/school-onboarding-v1
      - feature/school-administration-v1
      - feature/student-admissions-v1
      - feature/classrooms-homework-attendance-v1
      - feature/curriculum-assessments-reports-v1
      - feature/module-06-school-communications-v1
      - feature/module-07-school-fees-rwf-v1
      - feature/platform-demo-tenant-secure-purge-v1
  workflow_dispatch:
# A newer commit on the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned direct dependencies (lockfile pending)
        run: npm install --no-audit --no-fund
      - name: Unit and static security checks
        run: npm test
      - name: Compile production web application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://stgqhkhfpnqmsiyrvvhe.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder-for-build-only
# Isolated CI tests all ten GitHub-owned migrations plus transactional mock tenant purge.
# Never run this smoke test against hosted APEX or another non-local database.
# NO production database deployment in this workflow.
# Do not add a second migration deployer if Supabase native GitHub integration is enabled.

  database-schema-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0
      - name: Generate local-only migration using Supabase CLI
        run: |
          supabase --version
          supabase init
          supabase migration new platform_owner_console
          cp database/platform_owner_console.sql "$(find supabase/migrations -maxdepth 1 -name '*_platform_owner_console.sql' | head -n 1)"
          sleep 1
          supabase migration new school_onboarding_v1
          cp database/school_onboarding_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_school_onboarding_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new school_administration_v1
          cp database/school_administration_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_school_administration_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new school_admissions_v1
          cp database/school_admissions_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_school_admissions_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new school_classrooms_v1
          cp database/school_classrooms_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_school_classrooms_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new school_reports_curriculum_v1
          cp database/school_reports_curriculum_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_school_reports_curriculum_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new school_communications_v1
          cp database/school_communications_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_school_communications_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new school_fees_rwf_v1
          cp database/school_fees_rwf_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_school_fees_rwf_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new platform_demo_tenant_purge_v1
          cp database/platform_demo_tenant_purge_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_platform_demo_tenant_purge_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new school_homepage_sections_v1
          cp database/school_homepage_sections_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_school_homepage_sections_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new school_auth_identity_read_v1
          cp database/school_auth_identity_read_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_school_auth_identity_read_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new school_learning_materials_v1
          cp database/school_learning_materials_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_school_learning_materials_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new school_staff_requests_v1
          cp database/school_staff_requests_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_school_staff_requests_v1.sql' | head -n 1)"
          sleep 1
          supabase migration new platform_dashboard_v1
          cp database/platform_dashboard_v1.sql "$(find supabase/migrations -maxdepth 1 -name '*_platform_dashboard_v1.sql' | head -n 1)"
      - name: Start isolated Supabase and apply migration
        run: |
          supabase start
          supabase db reset
      - name: Exercise two synthetic tenants and validate permanent wipe, no cross-school damage
        run: |
          PGPASSWORD=postgres psql --host 127.0.0.1 --port 54322             --username postgres --dbname postgres --set ON_ERROR_STOP=1             --file tests/platform-tenant-purge.smoke.sql
      - name: Stop local stack
        if: always()
        run: supabase stop || true
# This job uses local Docker only. No project ref, remote credentials or --remote flag.
